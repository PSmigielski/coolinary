# Provisioned Prometheus datasource. Dashboards reference it by uid "prometheus".
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      # Matches the global scrape_interval, so $__rate_interval is at least 4 x 15s.
      timeInterval: 15s
