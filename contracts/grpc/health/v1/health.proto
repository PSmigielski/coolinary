// Standard gRPC health checking protocol, copied from
// https://github.com/grpc/grpc-proto/blob/master/grpc/health/v1/health.proto (Apache License 2.0).
// Not generated into services (each runtime has its own implementation); it is only
// included in the descriptor sets the Bun services use for reflection, so grpcurl can
// call grpc.health.v1.Health on them.
syntax = "proto3";

package grpc.health.v1;

option go_package = "google.golang.org/grpc/health/grpc_health_v1";

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3; // Used only by the Watch method.
  }
  ServingStatus status = 1;
}

service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
  rpc Watch(HealthCheckRequest) returns (stream HealthCheckResponse);
}
