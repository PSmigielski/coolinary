syntax = "proto3";

package coolinary.identity.v1;

// Accounts, households and entitlements.
service IdentityService {
  rpc GetHousehold(GetHouseholdRequest) returns (GetHouseholdResponse);
}

message GetHouseholdRequest {
  string household_id = 1;
}

message GetHouseholdResponse {
  Household household = 1;
}

message Household {
  string id = 1;
  string name = 2;
  string owner_user_id = 3;
  repeated Member members = 4;
  Plan plan = 5;
}

message Member {
  string id = 1;
  string display_name = 2;
  Role role = 3;
  // False for profiles without an account (children, people without a phone).
  bool has_account = 4;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER = 1;
  ROLE_MEMBER = 2;
  ROLE_PROFILE = 3;
}

enum Plan {
  PLAN_UNSPECIFIED = 0;
  PLAN_FREE = 1;
  PLAN_PLUS = 2;
}
