syntax = "proto3";

package coolinary.notifier.v1;

// Push notifications and e-mail.
service NotifierService {
  rpc SendEmail(SendEmailRequest) returns (SendEmailResponse);
}

message SendEmailRequest {
  string to = 1;
  string subject = 2;
  string text_body = 3;
  string html_body = 4;
}

message SendEmailResponse {
  string message_id = 1;
}
