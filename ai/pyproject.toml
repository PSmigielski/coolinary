[project]
name = "coolinary-ai"
version = "0.1.0"
description = "Coolinary AI service: every LLM call goes through here (gRPC), traced in Langfuse."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162",
    "grpcio==1.85.1",
    "grpcio-health-checking==1.85.1",
    "grpcio-reflection==1.85.1",
    "langfuse>=5.1,<6",
    "prometheus-client>=0.26",
    "protobuf>=7.35.1,<8",
    "redis>=8.1",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.17.3",
    "watchfiles>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# coolinary_ai = service code; coolinary = generated gRPC code (make proto)
packages = ["src/coolinary_ai", "src/coolinary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
extend-exclude = ["src/coolinary"]
