# Every AI job's model, effort and limits (AI-01-01). Changing a model is a config change.
# Starting values; each is tuned by the job's golden set (AI-03).
#
# model              a model in prices.toml, without a date suffix
# effort             low, medium, high, xhigh or max
# max_tokens         256–64000
# timeout_seconds    5–120
# max_retries        0–3
# cache_ttl_seconds  how long a result stays in the result cache (AI-01-09)
# enabled            false: calls fail UNAVAILABLE ai_disabled and the caller's non-AI fallback runs
# fallbacks          server-side refusal fallbacks; used only while the job runs on a Sonnet model (Q017, Q243)
#
# [<job>.by_plan.free] / [<job>.by_plan.plus] override model and effort for one plan; an empty or unknown x-plan
# uses free. Env overrides win over this file for every plan (Q240): AI_JOB_<JOB>_MODEL, AI_JOB_<JOB>_EFFORT,
# AI_JOB_<JOB>_ENABLED. The one exception is compose_day_plan's Free model, fixed to Haiku (decision 15).

[text_to_items]
model = "claude-haiku-5-5"
effort = "low"
max_tokens = 4000
timeout_seconds = 15
max_retries = 2
cache_ttl_seconds = 604800  # 7 days
enabled = true
fallbacks = false

